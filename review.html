<style>
:root{
  --bg:#0c0f1a;
  --bg-2:#121627;
  --panel:#161b30;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --text:#eef1f8;
  --muted:#8b93ad;
  --muted-2:#666e88;
  --accent:#6d8bff;
  --accent-soft:rgba(109,139,255,.14);
  --radius:14px;

  /* 영상 주변(무대) — 아이보리 */
  --stage:#f4f1e8;
  --stage-text:#23272f;
  --stage-muted:#7b7566;
}

*{box-sizing:border-box;}

html,body{height:100%;margin:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
input{font:inherit;}

/* ───────── 상단바 ───────── */
.topbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 20px;
  height:60px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0));
  border-bottom:1px solid var(--line);
}

.home{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;
  border-radius:9px;
  color:var(--muted);
  transition:background .16s,color .16s;
}
.home svg{width:19px;height:19px;}
.home:hover{background:rgba(255,255,255,.06);color:#fff;}

.pdtabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;}
.pdtabs::-webkit-scrollbar{display:none;}
.pdtab{
  padding:8px 13px;
  border-radius:9px;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  transition:background .16s,color .16s;
  white-space:nowrap;
}
.pdtab:hover{color:#fff;background:rgba(255,255,255,.05);}
.pdtab.on{color:#fff;background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(109,139,255,.32);}

.tools{margin-left:auto;display:flex;align-items:center;gap:10px;}

.ratio{
  display:flex;
  padding:3px;
  border-radius:9px;
  background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px var(--line);
}
.ratio button{
  padding:5px 12px;
  border-radius:7px;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  transition:background .16s,color .16s;
}
.ratio button.on{background:rgba(255,255,255,.12);color:#fff;}

/* ───────── 레이아웃 ───────── */
.shell{flex:1 1 auto;display:flex;min-height:0;}

/* ───────── 사이드바 ───────── */
.side{
  flex:0 0 316px;
  display:flex;
  flex-direction:column;
  min-height:0;
  background:var(--bg-2);
  border-right:1px solid var(--line);
}

.sidehead{
  padding:16px 16px 0;
  font-size:14px;
  font-weight:700;
  letter-spacing:-.01em;
  line-height:1.4;
  color:var(--text);
}

.search{padding:12px 14px 10px;}
.search input{
  width:100%;
  padding:9px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--text);
  font-size:13px;
  outline:none;
  transition:border-color .16s,background .16s;
}
.search input::placeholder{color:var(--muted-2);}
.search input:focus{border-color:rgba(109,139,255,.5);background:rgba(255,255,255,.07);}

.rounds{flex:1 1 auto;overflow-y:auto;padding:0 8px 20px;}
.rounds::-webkit-scrollbar{width:10px;}
.rounds::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border:3px solid var(--bg-2);border-radius:10px;}
.rounds::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);}

.round{margin-bottom:2px;}

.round-head{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  padding:10px 10px;
  border-radius:9px;
  text-align:left;
  transition:background .14s;
}
.round-head:hover{background:rgba(255,255,255,.045);}
.round-head .chev{
  flex:0 0 auto;
  width:14px;height:14px;
  color:var(--muted);
  transition:transform .2s ease;
}
.round.open .round-head .chev{transform:rotate(90deg);}
.round-head .nm{flex:1 1 auto;font-size:13.5px;font-weight:650;letter-spacing:-.01em;}
.round-head .ct{
  flex:0 0 auto;
  font-size:11px;
  color:var(--muted-2);
  padding:2px 7px;
  border-radius:99px;
  background:rgba(255,255,255,.05);
}

.roundnote{
  padding:2px 12px 8px 33px;
  font-size:11px;
  line-height:1.65;
  color:var(--muted-2);
}

.round-body{display:none;padding:2px 0 8px;}
.round.open .round-body{display:block;}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:8px 10px 8px 33px;
  border-radius:8px;
  text-align:left;
  color:var(--muted);
  font-size:13px;
  transition:background .14s,color .14s;
}
.item:hover{background:rgba(255,255,255,.05);color:var(--text);}
.item.on{background:var(--accent-soft);color:#fff;font-weight:600;}
.item .dot{
  flex:0 0 auto;
  width:5px;height:5px;border-radius:99px;
  background:var(--muted-2);
  transition:background .14s,box-shadow .14s;
}
.item.on .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(109,139,255,.2);}
.item.soon{color:var(--muted-2);cursor:default;}
.item.soon:hover{background:none;color:var(--muted-2);}
.item.soon .dot{background:rgba(255,255,255,.12);}
.item .lb{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .ext{flex:0 0 auto;font-size:10px;color:var(--muted-2);}
.item .dur{flex:0 0 auto;font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.item.on .dur{color:var(--muted);}

.sidefoot{
  flex:0 0 auto;
  padding:11px 16px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--muted-2);
  display:flex;
  justify-content:space-between;
  gap:8px;
}

/* ───────── 무대 ───────── */
.stage{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  padding:14px 22px 18px;
  gap:10px;
  background:var(--stage);
  color:var(--stage-text);
}

.frame{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:flex-start;   /* 정보 바 바로 아래에 붙는다 */
  justify-content:center;
}

.box{
  position:relative;
  max-width:100%;
  max-height:100%;
  border-radius:12px;
  overflow:hidden;
  background:#000;
  box-shadow:0 10px 34px rgba(60,50,30,.18);
  transition:width .28s cubic-bezier(.4,0,.2,1),height .28s cubic-bezier(.4,0,.2,1);
}
.box iframe{display:block;width:100%;height:100%;border:0;}
.box .loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:#e9e5da;
  color:var(--stage-muted);
  font-size:13px;
  transition:opacity .35s ease;
}
.box.ready .loading{opacity:0;pointer-events:none;}
.box .spin{
  width:14px;height:14px;border-radius:99px;
  border:2px solid rgba(0,0,0,.12);
  border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.box.pending{background:#e9e5da;box-shadow:0 10px 34px rgba(60,50,30,.14);}
.box.pending .ph{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-align:center;padding:26px;
}
.box.pending .big{font-size:15px;font-weight:700;color:var(--stage-text);}
.box.pending .sm{font-size:12.5px;color:var(--stage-muted);line-height:1.7;}

/* 무대 위의 안내문(불러오는 중 / 등록된 영상 없음)은 아이보리 배경에 맞춘다 */
.frame .empty .big{color:var(--stage-text);}
.frame .empty .sm{color:var(--stage-muted);}

.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  height:100%;
  color:var(--muted-2);
  text-align:center;
  padding:24px;
}
.empty .big{font-size:15px;color:var(--muted);font-weight:600;}
.empty .sm{font-size:12.5px;max-width:420px;line-height:1.65;}

/* ───────── 하단 바 ───────── */
.nowbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 2px 2px;
  min-height:40px;
}
.nowmeta{min-width:0;flex:1 1 auto;}
.nowmeta .n1{font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--stage-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nowmeta .n2{font-size:11.5px;color:var(--stage-muted);margin-top:2px;}
.nowacts{display:flex;gap:7px;flex:0 0 auto;}
.act{
  padding:6px 11px;
  border-radius:7px;
  font-size:12.5px;
  font-weight:600;
  color:var(--stage-muted);
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.act:hover:not(:disabled){background:rgba(0,0,0,.07);color:var(--stage-text);}
.act:disabled{opacity:.35;cursor:default;}

.toast{
  position:fixed;
  left:50%;bottom:34px;
  transform:translate(-50%,14px);
  padding:10px 18px;
  border-radius:10px;
  background:rgba(24,29,48,.96);
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px var(--line-2);
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:50;
}
.toast.on{opacity:1;transform:translate(-50%,0);}

@media (max-width:900px){
  .topbar{height:auto;flex-wrap:wrap;gap:12px;padding:12px 16px;}
  .tools{width:100%;}
  .shell{flex-direction:column;}
  .side{flex:0 0 auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line);}
  .stage{padding:14px;}
}
</style>
</head>
<body>

  <button class="home" id="home" title="처음으로" aria-label="처음으로">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M3.5 8.6L10 3.2l6.5 5.4V16a1 1 0 0 1-1 1h-3.2v-4.4H7.7V17H4.5a1 1 0 0 1-1-1V8.6z"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>

        <button class="act" id="copy" disabled>링크 복사</button>

</div>

<script>
(function(){
"use strict";

var REMOTE = "https://axexam.mycafe24.com/exam/";

/* 사이트에 올렸으면 상대경로, 로컬에서 더블클릭했으면 절대경로 */
function base(){
  if (location.protocol === "file:") return REMOTE;
  var dir = location.origin + location.pathname.replace(/[^/]*$/, "");
  return /\/exam\/$/.test(dir) ? dir : REMOTE;
}

var $ = function(id){ return document.getElementById(id); };

var state = { tab:"", rounds:[], flat:[], cur:-1, ratio:"16x9", q:"" };

/* ── 제목 오버라이드 ── */
function roundName(r){ return (TITLES.rounds && TITLES.rounds[r]) || r; }

/* 목록용 이름: 회차 헤더에 이미 "1회"가 있으므로 "1회 1~10번" → "1~10번" 으로 줄인다.
   TITLES.items 에 적어둔 이름이 있으면 그것이 항상 이긴다. */
function itemName(v, round){
  var l = v.label || "";
  var t = TITLES.items && TITLES.items[l];
  if (t) return t;
  if (round && l.indexOf(round) === 0) {
    var s = l.slice(round.length).replace(/^[\s·\-–—]+/, "");
    if (s) return s;
  }
  return l;
}
/* 하단 바 등 맥락이 없는 곳에서는 원래 라벨(회차 포함)을 쓴다 */
function fullName(v){
  var l = v.label || "";
  return (TITLES.items && TITLES.items[l]) || l;
}

/* ── check.js 의 vidSrc() 규칙을 그대로 따른다 ── */
function embedSrc(v){
  var id = v.id || "";
  if (v.provider === "vimeo") return "https://player.vimeo.com/video/" + id;
  if (v.provider === "file")  return id;
  if (v.provider === "drive") return "https://drive.google.com/file/d/" + id + "/preview";
  var s = parseInt(v.sec, 10) || 0;
  return "https://www.youtube.com/embed/" + id + "?rel=0&modestbranding=1" + (s ? "&start=" + s : "");
}
/* 영상 길이 표기 — 목록엔 8:34 / 1:16:44, 제목줄엔 8분 34초 / 1시간 16분 */
function fmtDur(s){
  s = Math.round(s);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
}
function fmtDurLong(s){
  s = Math.round(s);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  if (h) return h + "시간 " + m + "분";
  return m + "분 " + x + "초";
}

/* provider=link 는 embed 하지 않고 새 창으로 연다 */
function isLink(v){ return v.provider === "link"; }
function outUrl(v){
  if (isLink(v)) return v.id;
  if (v.provider === "drive") return "https://drive.google.com/file/d/" + (v.id||"") + "/view";
  if (v.provider === "vimeo") return "https://vimeo.com/" + (v.id||"");
  if (v.provider === "file")  return v.id;
  return "https://youtu.be/" + (v.id||"");
}

/* ── 데이터 로딩 ── */
function loadVideos(pd, done){
  window.VIDEOS = null;
  var old = $("vjs");
  if (old) old.parentNode.removeChild(old);

  var s = document.createElement("script");
  s.id = "vjs";
  s.src = base() + "pd/" + encodeURIComponent(pd) + "/videos.js?t=" + Date.now();
  s.onload  = function(){ done(window.VIDEOS && typeof window.VIDEOS === "object" ? window.VIDEOS : {}); };
  s.onerror = function(){ done(null); };
  document.head.appendChild(s);
}

/* 레벨 제한 영상 합치기 — check.js 와 같은 방식. 로컬(file://)에서는 건너뛴다 */
function mergePrivate(pd, map, done){
  if (location.protocol === "file:") { done(map, true); return; }
  fetch(base() + "api/videos.php?pd=" + encodeURIComponent(pd), { credentials:"include" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (j && j.ok && j.items && typeof j.items === "object") {
        Object.keys(j.items).forEach(function(r){
          var add = j.items[r];
          if (!Array.isArray(add) || !add.length) return;
          map[r] = (map[r] || []).concat(add);
          map[r].sort(function(a,b){ return (a.part||0) - (b.part||0); });
        });
      }
      done(map, false);
    })
    .catch(function(){ done(map, false); });
}

/* ── 드라이브 폴더 자동 읽기 (TABS 의 folder:"…") ──
   review.html 옆의 folder.php 가 폴더 목록을 JSON 으로 준다. 실패하면 적어둔 id 만 쓴다. */
function loadFolder(folderId, done){
  var url = location.pathname.replace(/[^/]*$/, "") + "folder.php?id=" + encodeURIComponent(folderId) + "&t=" + Date.now();
  fetch(url).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ done(j && j.ok && Array.isArray(j.files) ? j.files : []); })
    .catch(function(){ done([]); });
}

/* 폴더 파일을 목록에 끼워 넣는다.
   - 파일명 앞의 숫자(01-img-motion.mp4 → 1)와 label 앞의 숫자(01장 … → 1)가 같고 id 가 비어 있으면 그 자리에
   - 어느 항목에도 안 맞는 파일은 "기타" 묶음으로 끝에 붙인다 (이름이 규칙에 안 맞아도 잃어버리지 않게)
   - 이미 id 가 적힌 항목은 그대로 둔다. 길이(sec)는 DUR 에 합친다 */
function mergeFolder(map, files){
  map = map || {};
  if (!files.length) return map;
  var used = {};
  Object.keys(map).forEach(function(r){
    (map[r] || []).forEach(function(v){ if (v.id) used[v.id] = true; });
  });
  var out = {};
  Object.keys(map).forEach(function(r){
    out[r] = (map[r] || []).map(function(v){
      var o = { label:v.label, id:v.id };
      if (!o.id) {
        var i, f, hit = -1;
        if (v.file) {
          /* file:"q3-01-03" → 파일명이 "q3-01-03_" 또는 "q3-01-03." 으로 시작하는 것 */
          for (i = 0; i < files.length; i++) {
            f = files[i];
            if (!used[f.id] && (f.name || "").indexOf(v.file) === 0 && /^[_.]/.test((f.name || "").slice(v.file.length))) { hit = i; break; }
          }
        } else {
          /* file 이 없으면 라벨 앞 숫자와 파일명 앞 숫자 비교 (01장 … ↔ 01-….mp4) */
          var n = (v.label || "").match(/^\d+/);
          if (n) for (i = 0; i < files.length; i++) {
            f = files[i];
            var fn = (f.name || "").match(/^\d+/);
            if (fn && !used[f.id] && parseInt(fn[0], 10) === parseInt(n[0], 10)) { hit = i; break; }
          }
        }
        if (hit >= 0) { o.id = files[hit].id; used[files[hit].id] = true; }
      }
      return o;
    });
  });
  var rest = files.filter(function(f){ return !used[f.id]; });
  if (rest.length) out["기타"] = rest.map(function(f){ return { label:(f.name || "").replace(/\.[a-z0-9]+$/i, ""), id:f.id }; });
  files.forEach(function(f){ if (f.sec > 0 && !DUR[f.id]) DUR[f.id] = f.sec; });
  return out;
}

/* ── 렌더 ── */
function buildRounds(map){
  var keys = Object.keys(map).filter(function(k){ return Array.isArray(map[k]) && map[k].length; });
  keys.sort(function(a,b){ return a.localeCompare(b, "ko", { numeric:true }); });
  var all = keys.map(function(k){ return { key:k, items:map[k] }; });

  /* 업로드된 영상이 들어 있는 묶음을 위로 올린다(원래 순서는 그대로).
     아직 하나도 안 올라온 묶음은 아래로 내려가 목록 맨 위가 늘 재생 가능한 것부터가 된다. */
  function has(g){ return g.items.some(function(v){ return !!v.id; }); }
  return all.filter(has).concat(all.filter(function(g){ return !has(g); }));
}

function renderSide(){
  var wrap = $("rounds");
  var q = state.q.trim().toLowerCase();
  var html = "", n = 0, shown = 0;
  state.flat = [];

  /* 아직 한 편도 안 올라온 탭이면 목차가 통째로 숨지 않도록 첫 묶음은 펼쳐 둔다 */
  var noneUploaded = !state.rounds.some(function(g){
    return g.items.some(function(v){ return !!v.id; });
  });

  state.rounds.forEach(function(rd, ri){
    var rows = "", hit = 0;
    rd.items.forEach(function(v){
      var idx = state.flat.length;
      state.flat.push({ round:rd.key, v:v });
      n++;
      var nm = itemName(v, rd.key);
      if (q && (nm + " " + fullName(v)).toLowerCase().indexOf(q) < 0 && rd.key.toLowerCase().indexOf(q) < 0) return;
      hit++; shown++;
      var rdy = !!v.id;
      var tail = !rdy ? '<span class="ext">준비중</span>'
               : isLink(v) ? '<span class="ext">새창</span>'
               : (DUR[v.id] ? '<span class="dur">' + fmtDur(DUR[v.id]) + '</span>' : '');
      rows += '<button class="item' + (rdy ? '' : ' soon') + '" data-i="' + idx + '"' + (rdy ? '' : ' disabled') + '>' +
                '<span class="dot"></span>' +
                '<span class="lb">' + esc(nm) + '</span>' + tail +
              '</button>';
    });
    if (q && !hit) return;
    /* 업로드된 영상이 있는 묶음은 펼친 채로 시작한다. 아직 안 올라온 묶음만 접어 둔다. */
    var open = q ? true : (rd.items.some(function(v){ return !!v.id; }) || (noneUploaded && ri === 0));
    /* 탭에 note 가 있으면 첫 묶음 제목 바로 아래에 작은 글씨로 붙인다(접어도 계속 보임) */
    var note = "";
    if (ri === 0 && !q && state.note && state.note.length) {
      note = '<div class="roundnote">' +
               state.note.map(function(t){ return esc(t); }).join("<br>") +
             '</div>';
    }

    html += '<div class="round' + (open ? " open" : "") + '" data-r="' + ri + '">' +
              '<button class="round-head">' +
                '<svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
                  '<path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
                '</svg>' +
                '<span class="nm">' + esc(roundName(rd.key)) + '</span>' +
                '<span class="ct">' + rd.items.length + '편</span>' +
              '</button>' + note +
              '<div class="round-body">' + rows + '</div>' +
            '</div>';
  });

  wrap.innerHTML = html || '<div class="empty" style="height:160px"><div class="sm">검색 결과가 없습니다.</div></div>';

  var ready = state.flat.filter(function(e){ return !!e.v.id; }).length;
  $("cnt").textContent = q ? (shown + " / " + n + "편")
                           : (ready < n ? (ready + " / " + n + "편 준비") : ("총 " + n + "편"));

  wrap.querySelectorAll(".round-head").forEach(function(h){
    h.onclick = function(){ h.parentNode.classList.toggle("open"); };
  });
  wrap.querySelectorAll(".item").forEach(function(b){
    b.onclick = function(){ play(parseInt(b.getAttribute("data-i"), 10)); };
  });
  mark();
}

function mark(){
  document.querySelectorAll("#rounds .item").forEach(function(b){
    b.classList.toggle("on", parseInt(b.getAttribute("data-i"), 10) === state.cur);
  });
}

function fitBox(){
  var box = document.querySelector(".box");
  if (!box) return;
  var f = $("frame");
  var aw = f.clientWidth, ah = f.clientHeight;
  var rw = state.ratio === "9x16" ? 9 : 16;
  var rh = state.ratio === "9x16" ? 16 : 9;
  var w = aw, h = w * rh / rw;
  if (h > ah) { h = ah; w = h * rw / rh; }
  box.style.width  = Math.floor(w) + "px";
  box.style.height = Math.floor(h) + "px";
}

/* 아직 영상이 안 올라온 목록 — 화면비는 그대로 보여준다(세로형 확인용) */
function showPending(){
  $("frame").innerHTML =
    '<div class="box pending"><div class="ph">' +
      '<div class="big">업로드 준비중</div>' +
      '<div class="sm">목록은 전체가 나와 있습니다.<br>영상이 올라오면 이 자리에서 바로 재생됩니다.</div>' +
    '</div></div>';
  fitBox();
}

function play(i){
  var e = state.flat[i];
  if (!e || !e.v.id) return;
  state.cur = i;
  var v = e.v;

  $("n1").textContent = fullName(v);
  $("n2").textContent = roundName(e.round) + " · " + (v.provider || "youtube") +
                        (DUR[v.id] ? " · " + fmtDurLong(DUR[v.id]) : "");
  $("prev").disabled = i <= 0;
  $("next").disabled = i >= state.flat.length - 1;
  $("open").disabled = false;
  $("copy").disabled = false;

  var f = $("frame");
  if (isLink(v)) {
    f.innerHTML = '<div class="empty">' +
        '<div class="big">새 창으로 여는 영상입니다</div>' +
        '<div class="sm">이 항목은 공유 링크(내려받아 보는 검토용)로 등록돼 있어 화면 안에서 재생하지 않습니다. 아래 <b>새 창</b> 버튼을 눌러 주세요.</div>' +
      '</div>';
  } else {
    /* 드라이브 플레이어가 뜨기까지 1~3초 걸린다 — 그동안 검은 화면 대신 로딩 표시 */
    f.innerHTML = '<div class="box">' +
        '<iframe allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer-when-downgrade" src="' + esc(embedSrc(v)) + '"></iframe>' +
        '<div class="loading"><span class="spin"></span>불러오는 중</div>' +
      '</div>';
    /* iframe 의 load 는 드라이브 문서가 뜰 때 나지만 영상 첫 프레임은 그보다 늦게 그려진다.
       load 후 조금 더 가린 뒤 걷어낸다(먹통이면 6초 뒤 강제로 걷어냄). */
    var bx = f.querySelector(".box");
    var reveal = function(){ if (bx) bx.classList.add("ready"); };
    var ifr = f.querySelector("iframe");
    if (ifr) ifr.onload = function(){ setTimeout(reveal, 1400); };
    setTimeout(reveal, 6000);
    fitBox();
  }

  var u = new URL(location.href);
  u.searchParams.set("t", state.tab);
  u.searchParams.set("v", String(i));
  history.replaceState(null, "", u);

  mark();
  var el = document.querySelector('#rounds .item[data-i="' + i + '"]');
  if (el) {
    var rd = el.closest(".round");
    if (rd && !rd.classList.contains("open")) rd.classList.add("open");
    el.scrollIntoView({ block:"nearest" });
  }
}

function showEmpty(big, sm){
  $("frame").innerHTML = '<div class="empty"><div class="big">' + esc(big) + '</div>' +
    (sm ? '<div class="sm">' + sm + '</div>' : '') + '</div>';
}

function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("on"); }, 1600);
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ── 탭 전환 ── */
function setRatio(r){
  state.ratio = r;
  document.querySelectorAll(".ratio button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-r") === r);
  });
  fitBox();
}

/* VIDEOS_BY_TAB 항목은 provider 를 생략할 수 있다 — 기본값 drive */
function fromDrive(obj){
  var map = {};
  Object.keys(obj || {}).forEach(function(g){
    var list = obj[g];
    if (!Array.isArray(list) || !list.length) return;
    /* id 가 아직 비어 있는 항목도 목록에는 남긴다 — 화면에 "준비중" 으로 표시 */
    map[g] = list.map(function(v, i){
      return { label:v.label || (g + " " + (i+1)), provider:v.provider || "drive", id:v.id || "", part:i+1, sec:v.sec||0 };
    });
  });
  return map;
}

function firstVisible(){
  return TABS.filter(function(t){ return !t.hidden; })[0] || TABS[0];
}

function openTab(key, wantIdx){
  var tab = TABS.filter(function(t){ return t.key === key; })[0] || firstVisible();
  state.tab = tab.key;
  state.cur = -1;
  state.rounds = [];
  state.flat = [];
  $("rounds").innerHTML = "";
  $("cnt").textContent = "";
  $("src").textContent = "";
  $("n1").textContent = "—";
  $("n2").textContent = "";
  ["prev","next","open","copy"].forEach(function(id){ $(id).disabled = true; });
  showEmpty("불러오는 중…", "");

  document.querySelectorAll(".pdtab").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-k") === tab.key);
  });
  setRatio(tab.ratio || "16x9");

  /* 좌측 상단 — 탭의 풀네임(책 제목 등). 없으면 감춘다. */
  var sh = $("sidehead");
  sh.textContent = tab.heading || "";
  sh.hidden = !tab.heading;
  state.note = tab.note || null;

  function finish(map, skipped){
    state.rounds = buildRounds(map);
    $("src").textContent = skipped ? "로컬 · 공개분만" : "";
    renderSide();
    if (!state.rounds.length) {
      if (tab.from === "drive") {
        showEmpty("아직 등록된 영상이 없습니다",
          "<b>review.html</b> 을 열어 <b>VIDEOS_BY_TAB</b> 의 <b>\"" + esc(tab.key) + "\"</b> 아래에<br>" +
          "구글드라이브 영상을 적으면 여기에 바로 나타납니다.");
      } else {
        showEmpty("아직 등록된 영상이 없습니다",
          esc(tab.name) + " 의 목록(<b>pd/" + esc(tab.pd) + "/videos.js</b>)이 비어 있습니다.<br>" +
          "<b>youtube_map.json</b> 에 항목을 채우고 다시 빌드하면 자동으로 나타납니다.");
      }
      return;
    }
    var want = (typeof wantIdx === "number" && state.flat[wantIdx] && state.flat[wantIdx].v.id) ? wantIdx : -1;
    if (want < 0) {
      for (var i = 0; i < state.flat.length; i++) { if (state.flat[i].v.id) { want = i; break; } }
    }
    if (want < 0) { showPending(); return; }
    play(want);
  }

  if (tab.from === "drive") {
    if (tab.folder && location.protocol !== "file:") {
      loadFolder(tab.folder, function(files){
        finish(fromDrive(mergeFolder(VIDEOS_BY_TAB[tab.key], files)), false);
      });
    } else {
      finish(fromDrive(VIDEOS_BY_TAB[tab.key]), false);
    }
    return;
  }

  loadVideos(tab.pd, function(map){
    if (map === null) {
      showEmpty("아직 등록된 영상이 없습니다",
        esc(tab.name) + " 의 목록 파일(<b>pd/" + esc(tab.pd) + "/videos.js</b>)이 아직 없습니다.<br>" +
        "<b>youtube_map.json</b> 에 항목을 채우고 다시 빌드하면 자동으로 나타납니다.");
      return;
    }
    mergePrivate(tab.pd, map, finish);
  });
}

/* ── 초기화 ── */
function init(){
  document.title = (TITLES.page || "해설영상");

  /* hidden:true 인 탭은 메뉴에서 뺀다. 주소로 직접 열면(?t=키) 미리 볼 수 있다. */
  $("pdtabs").innerHTML = TABS.filter(function(t){ return !t.hidden; }).map(function(t){
    return '<button class="pdtab" data-k="' + esc(t.key) + '">' + esc(t.name) + '</button>';
  }).join("");
  document.querySelectorAll(".pdtab").forEach(function(b){
    b.onclick = function(){ openTab(b.getAttribute("data-k")); };
  });
  $("home").onclick = function(){ openTab(firstVisible().key); };

  document.querySelectorAll(".ratio button").forEach(function(b){
    b.onclick = function(){ setRatio(b.getAttribute("data-r")); };
  });

  $("q").oninput = function(){ state.q = this.value; renderSide(); };
  $("prev").onclick = function(){ if (state.cur > 0) play(state.cur - 1); };
  $("next").onclick = function(){ if (state.cur < state.flat.length - 1) play(state.cur + 1); };
  $("open").onclick = function(){
    var e = state.flat[state.cur];
    if (e) window.open(outUrl(e.v), "_blank", "noopener");
  };
  $("copy").onclick = function(){
    var e = state.flat[state.cur];
    if (!e) return;
    var url = outUrl(e.v);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function(){ toast("링크를 복사했습니다"); },
                                              function(){ window.prompt("복사하세요", url); });
    } else {
      window.prompt("복사하세요", url);
    }
  };

  document.addEventListener("keydown", function(ev){
    if (/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if (ev.key === "ArrowDown") { ev.preventDefault(); if (state.cur < state.flat.length - 1) play(state.cur + 1); }
    if (ev.key === "ArrowUp")   { ev.preventDefault(); if (state.cur > 0) play(state.cur - 1); }
  });

  var ro = new ResizeObserver(fitBox);
  ro.observe($("frame"));
  window.addEventListener("resize", fitBox);

  var p  = new URLSearchParams(location.search);
  var vi = parseInt(p.get("v"), 10);
  openTab(p.get("t") || firstVisible().key, isNaN(vi) ? undefined : vi);
}

document.addEventListener("DOMContentLoaded", init);
})();
</script>
